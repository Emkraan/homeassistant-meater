name: automerge

# Thin caller. All merge logic lives in the fleet reusable workflow
# Emkraan/.github/.github/workflows/reusable-automerge.yml (standard: apollo
# docs/standards/github-repo-standard.md Section 8). Never add merge logic here; change
# the reusable workflow instead. Only the triggers are repo-specific:
# `workflow_run.workflows` must list EVERY workflow in this repo that runs on
# pull_request (matched by workflow `name:`, not job name), so automerge re-evaluates
# after the last PR check finishes.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  automerge:
    uses: Emkraan/.github/.github/workflows/reusable-automerge.yml@main
    with:
      runs-on: '"ubuntu-latest"'
